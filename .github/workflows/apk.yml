name: Gerar APK VERBOX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools python3-dev build-essential libssl-dev libffi-dev python3-venv liblzo2-dev libbz2-dev libsqlite3-dev libncurses5-dev libncursesw5-dev zlib1g-dev libreadline-dev liblzma-dev libgdm-dev uuid-dev libgirepository1.0-dev libcairo2-dev pkg-config libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev autoconf automake libtool libfreetype6-dev libjpeg8-dev libopenjp2-7-dev
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK com Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
