name: Gerar APK VERBOX
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y libltdl-dev zip unzip
          pip install buildozer cython==0.29.33
      - name: Build APK
        run: buildozer android debug
      - name: Enviar pro Telegram
        run: |
          APK=$(find bin -name "*.apk" | head -n 1)
          curl -F document=@"$APK" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&caption=APK+VERBOX+PRONTO"
